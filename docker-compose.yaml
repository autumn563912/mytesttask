version: '3.8'

services:
  backend:
    container_name: python-backend
    build: backend/
    networks:
      - internal-network
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true

  nginx:
    container_name: nginx-proxy
    build: nginx/
    ports: 
      - ${HOST_PORT:-80}:80
    depends_on:
      - backend
    networks:
      - internal-network
      - external-network
    cap_drop:
      - ALL
    cap_add:
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/cache/nginx/client_temp:rw,noexec,nosuid
      - /var/cache/nginx/proxy_temp:rw,noexec,nosuid
      - /var/cache/nginx/fastcgi_temp:rw,noexec,nosuid
      - /var/cache/nginx/uwsgi_temp:rw,noexec,nosuid
      - /var/cache/nginx/scgi_temp:rw,noexec,nosuid
      - /run
    security_opt:
      - no-new-privileges:true

networks:
  internal-network:
    driver: bridge
    internal: true
  external-network:
    driver: bridge
